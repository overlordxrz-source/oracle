[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-osint"
version = "0.4.0"
description = "Free satellite OSINT: imagery search, foundation-model search, detection, change, tracking, super-resolution, aircraft in flight, and an evidence-citing investigation agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "affine>=2.4",
  "pyproj>=3.5",
  "pillow>=10",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn>=0.25",
  "sgp4>=2.22",                     # overpass prediction (pure Python, tiny)
]

[project.optional-dependencies]
ai = [                               # YOLO detection + Sentinel-2 super-resolution (pulls torch)
  "ultralytics>=8.3",                #   Ultralytics is AGPL-3.0
  "sen2sr>=0.8",                     #   ESA OpenSR SEN2SR (CC0 weights from Hugging Face)
  "safetensors>=0.4",
]
embed = ["pyarrow>=14"]              # AlphaEarth embeddings index (Google DeepMind, CC BY 4.0)
llm = ["anthropic>=1.0"]             # Claude agent and briefs
all = ["ultralytics>=8.3", "sen2sr>=0.8", "safetensors>=0.4", "pyarrow>=14", "anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=1.0", "pyarrow>=14"]

[project.scripts]
oracle = "oracle.cli:main"

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
oracle = ["web/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
markers = ["live: hits real public catalogs over the network (deselect with -m 'not live')"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
