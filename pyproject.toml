[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-osint"
version = "0.1.0"
description = "Free, high-resolution satellite imagery search, viewing and vessel detection for any point on Earth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "affine>=2.4",
  "pyproj>=3.5",
  "pillow>=10",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
oracle = "oracle.cli:main"

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
oracle = ["web/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
markers = ["live: hits real public catalogs over the network (deselect with -m 'not live')"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
